name: Deploy to Staging

on:
  push:
    branches: [ stage ]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/stage.laravel-project.com/public

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, redis, fileinfo, dom
        coverage: none
        
    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist
      
    - name: Run Tests
      run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, redis, fileinfo, dom
        coverage: none
        
    - name: Install Production Dependencies
      run: composer install --no-dev --optimize-autoloader
      
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
        
    - name: Create deployment directory
      run: |
        ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} << 'EOF'
          mkdir -p ${{ env.DEPLOY_PATH }}
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/app
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/cache
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/sessions
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/views
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/logs
          mkdir -p ${{ env.DEPLOY_PATH }}/bootstrap/cache
        EOF
        
    - name: Sync files to server
      run: |
        rsync -avz --delete \
          --exclude='.env' \
          --exclude='.env.example' \
          --exclude='node_modules' \
          --exclude='.git' \
          --exclude='storage' \
          --exclude='tests' \
          -e "ssh -i ~/.ssh/deploy_key" \
          ./ root@${{ secrets.SERVER_IP }}:${{ env.DEPLOY_PATH }}/
          
    - name: Sync storage directory
      run: |
        rsync -avz \
          -e "ssh -i ~/.ssh/deploy_key" \
          ./storage/ root@${{ secrets.SERVER_IP }}:${{ env.DEPLOY_PATH }}/storage/
          
    - name: Setup environment file
      run: |
        ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          if [ ! -f .env ]; then
            cp .env.example .env
            php artisan key:generate
          fi
        EOF
        
    - name: Install dependencies on server
      run: |
        ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          composer install --no-dev --optimize-autoloader
        EOF
        
    - name: Run migrations and cache
      run: |
        ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        EOF
        
    - name: Set permissions
      run: |
        ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} << 'EOF'
          chown -R lsws:lsws /home/stage.laravel-project.com
          chmod -R 755 ${{ env.DEPLOY_PATH }}/storage
          chmod -R 755 ${{ env.DEPLOY_PATH }}/bootstrap/cache
        EOF
        
    - name: Reload web server
      run: |
        ssh -i ~/.ssh/deploy_key root@${{ secrets.SERVER_IP }} << 'EOF'
          systemctl reload lsws 2>/dev/null || systemctl restart lsws
        EOF
        
    - name: Deployment successful
      if: success()
      run: echo "✅ Stage deployment to ${{ secrets.SERVER_IP }} successful!"
      
    - name: Deployment failed
      if: failure()
      run: echo "❌ Stage deployment failed!"
