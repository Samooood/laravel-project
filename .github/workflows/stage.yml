name: Deploy Staging

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-laravel.yml
    with:
      environment_name: staging
      deploy_path: /home/stage.laravel-project.com/public
      site_user: stage5907
      port: 8088
    secrets: inherit
