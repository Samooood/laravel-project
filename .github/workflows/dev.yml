name: Deploy to Development

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/dev.laravel-project.com/public

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, redis, fileinfo, dom
        coverage: none
        
    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist
      
    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate
        
    - name: Run Tests
      run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, redis, fileinfo, dom
        coverage: none
        
    - name: Install Production Dependencies
      run: composer install --no-dev --optimize-autoloader
      
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
        echo "SSH key setup complete"
        
    - name: Test SSH Connection
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"
        
    - name: Create deployment directory
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          mkdir -p ${{ env.DEPLOY_PATH }}
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/app
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/cache
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/sessions
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/views
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/logs
          mkdir -p ${{ env.DEPLOY_PATH }}/bootstrap/cache
        EOF
        
    - name: Sync files to server
      run: |
        rsync -avz --delete \
          --exclude='.env' \
          --exclude='node_modules' \
          --exclude='.git' \
          --exclude='storage' \
          --exclude='tests' \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/
          
    - name: Sync storage directory
      run: |
        rsync -avz \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
          ./storage/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/storage/
          
    - name: Setup environment file
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          if [ ! -f .env ]; then
            cp .env.example .env
            php artisan key:generate
          fi
          chown -R root:root ${{ env.DEPLOY_PATH }}
        EOF
        
    - name: Install dependencies on server
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          composer install --no-dev --optimize-autoloader
        EOF
        
    - name: Run migrations and cache
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        EOF
        
    - name: Set permissions
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          chown -R root:root ${{ env.DEPLOY_PATH }}
          chmod -R 755 ${{ env.DEPLOY_PATH }}/storage
          chmod -R 755 ${{ env.DEPLOY_PATH }}/bootstrap/cache
        EOF
        
    - name: Configure OpenLiteSpeed for IP access (no domain)
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          # Find LSWS httpd.conf
          HTTPD_CONF="/usr/local/lsws/conf/httpd.conf"
          
          if [ ! -f "$HTTPD_CONF" ]; then
            echo "ERROR: httpd.conf not found!"
            exit 1
          fi
          
          echo "Found httpd.conf at $HTTPD_CONF"
          
          # Backup original
          cp "$HTTPD_CONF" "${HTTPD_CONF}.bak.$(date +%s)"
          
          # Check if there's already a listener on port 80
          if grep -q 'address.*\*:80' "$HTTPD_CONF"; then
            echo "Port 80 listener already exists"
          else
            echo "Adding port 80 listener..."
            cat >> "$HTTPD_CONF" << 'LISTENER'

          listener Default {
              address *:80
              secure 0
              map defaultVhost *
          }
          LISTENER
          fi
          
          # Create/modify the default vhost config
          DEFAULT_VHOST_DIR="/usr/local/lsws/conf/vhosts/defaultVhost"
          mkdir -p "$DEFAULT_VHOST_DIR"
          
          cat > "$DEFAULT_VHOST_DIR/vhconf.conf" << 'VHOSTCONF'
          vhRoot /home/dev.laravel-project.com/public
          configFile /usr/local/lsws/conf/vhosts/defaultVhost/vhconf.conf
          allowSymbolLink 1
          enableScript 1
          restrained 0
          setUIDMode 2
          
          indexFiles {
              indexFiles index.php
          }
          
          errorpage 404 {
              url /index.php
          }
          
          accessLog {
              fileName logs/access.log
              useServer 1
          }
          
          scripAliases {
              lsapi /usr/local/lsws/lsphp84/bin/lsphp
          }
          VHOSTCONF
          
          # Create logs dir
          mkdir -p "$DEFAULT_VHOST_DIR/logs"
          
          # Make sure UFW allows port 80
          ufw allow 80/tcp 2>/dev/null || true
          
          # Graceful restart
          /usr/local/lsws/bin/lswsctrl graceful 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "Graceful restart failed, doing full restart..."
            systemctl restart lsws
          else
            echo "Graceful restart successful"
          fi
          
          # Verify
          echo "=== Checking if LSWS is running ==="
          systemctl status lsws --no-pager | head -5
        ENDSSH
        
    - name: Deployment successful
      if: success()
      run: echo "✅ Dev deployment successful!"
      
    - name: Deployment failed
      if: failure()
      run: echo "❌ Dev deployment failed!"
