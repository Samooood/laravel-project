name: Deploy to Development

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  DEPLOY_PATH: /home/dev.laravel-project.com/public

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, redis, fileinfo, dom
        coverage: none
        
    - name: Install Dependencies
      run: composer install --no-progress --prefer-dist
      
    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate
        
    - name: Run Tests
      run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, redis, fileinfo, dom
        coverage: none
        
    - name: Install Production Dependencies
      run: composer install --no-dev --optimize-autoloader
      
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
        echo "SSH key setup complete"
        
    - name: Test SSH Connection
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"
        
    - name: Create deployment directory
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          mkdir -p ${{ env.DEPLOY_PATH }}
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/app
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/cache
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/sessions
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/framework/views
          mkdir -p ${{ env.DEPLOY_PATH }}/storage/logs
          mkdir -p ${{ env.DEPLOY_PATH }}/bootstrap/cache
        EOF
        
    - name: Sync files to server
      run: |
        rsync -avz --delete \
          --exclude='.env' \
          --exclude='node_modules' \
          --exclude='.git' \
          --exclude='storage' \
          --exclude='tests' \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/
          
    - name: Sync storage directory
      run: |
        rsync -avz \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }}" \
          ./storage/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/storage/
          
    - name: Setup environment file
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          if [ ! -f .env ]; then
            cp .env.example .env
            php artisan key:generate
          fi
          chown -R root:root ${{ env.DEPLOY_PATH }}
        EOF
        
    - name: Install dependencies on server
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          composer install --no-dev --optimize-autoloader
        EOF
        
    - name: Run migrations and cache
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ env.DEPLOY_PATH }}
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
        EOF
        
    - name: Set permissions
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
          chown -R root:root ${{ env.DEPLOY_PATH }}
          chmod -R 755 ${{ env.DEPLOY_PATH }}/storage
          chmod -R 755 ${{ env.DEPLOY_PATH }}/bootstrap/cache
        EOF
        
    - name: Configure OpenLiteSpeed for IP access (no domain)
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
          # Find CyberPanel's default vHost and modify it
          # CyberPanel uses /home/cyberpanel/ for default or named vhosts
          
          # Find all vhconf.conf files
          echo "=== Finding vHost configs ==="
          find /usr/local/lsws -name "vhconf.conf" 2>/dev/null
          find /home -name "vhconf.conf" 2>/dev/null
          
          # Check current httpd.conf
          echo "=== Current httpd.conf listeners ==="
          grep -A5 "listener" /usr/local/lsws/conf/httpd.conf 2>/dev/null | head -30
          
          # Find the main vhost directory  
          echo "=== vHost directories ==="
          ls -la /usr/local/lsws/conf/vhosts/ 2>/dev/null
          ls -la /home/ 2>/dev/null
          
          # Find all conf files
          echo "=== All LSWS conf ==="
          ls -la /usr/local/lsws/conf/ 2>/dev/null
          
          echo "=== Done diagnostics ==="
        ENDSSH
        
    - name: Deployment successful
      if: success()
      run: echo "✅ Dev deployment successful!"
      
    - name: Deployment failed
      if: failure()
      run: echo "❌ Dev deployment failed!"
