name: Deploy Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, fileinfo, dom
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Synchronize application files
        run: |
          rsync -az --delete-delay \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='database/*.sqlite' \
            -e "ssh -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/prod.laravel-project.com/public/

      - name: Deploy to server
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} <<'EOF'
          set -euo pipefail

          DEPLOY_PATH='/home/prod.laravel-project.com/public'
          SITE_USER='prodl5985'
          PHP='/usr/local/lsws/lsphp84/bin/php'

          cd "$DEPLOY_PATH"

          # 1. تفعيل وضع الصيانة
          sudo -u "$SITE_USER" "$PHP" artisan down || true

          # 2. تحديث الاعتماديات
          sudo -u "$SITE_USER" "$PHP" $(which composer) install --no-dev --prefer-dist --no-interaction --optimize-autoloader

          # 3. تنفيذ الترحيلات
          sudo -u "$SITE_USER" "$PHP" artisan migrate --force

          # 4. تنظيف وإعادة بناء التخزين المؤقت
          sudo -u "$SITE_USER" "$PHP" artisan optimize:clear
          sudo -u "$SITE_USER" "$PHP" artisan config:cache
          sudo -u "$SITE_USER" "$PHP" artisan route:cache
          sudo -u "$SITE_USER" "$PHP" artisan view:cache
          sudo -u "$SITE_USER" "$PHP" artisan event:cache

          # 5. إعادة تشغيل الطوابير
          sudo -u "$SITE_USER" "$PHP" artisan queue:restart

          # 6. إيقاف وضع الصيانة
          sudo -u "$SITE_USER" "$PHP" artisan up
          EOF

      - name: Verify deployed application
        run: |
          ssh -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "curl --fail --silent --show-error --max-time 15 http://127.0.0.1:80/ > /dev/null"
