name: Reusable Laravel deployment

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment name.
        required: true
        type: string
      deploy_path:
        description: Absolute application path on the server.
        required: true
        type: string
      site_user:
        description: OpenLiteSpeed PHP user for this virtual host.
        required: true
        type: string
      port:
        description: HTTP port used for the post-deploy health check.
        required: true
        type: number

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, tokenizer, curl, fileinfo, dom
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict --no-interaction

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_HOST" true

      - name: Synchronize application files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          rsync -az --delete-delay \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='database/*.sqlite' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./ "$SSH_USERNAME@$SSH_HOST:${{ inputs.deploy_path }}/"

      - name: Install, migrate, and optimize on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" <<'EOF'
          set -euo pipefail

          DEPLOY_PATH='${{ inputs.deploy_path }}'
          SITE_USER='${{ inputs.site_user }}'
          PHP_BIN='/usr/local/lsws/lsphp84/bin/php'
          COMPOSER_BIN="$(command -v composer)"

          test -x "$PHP_BIN"
          test -n "$COMPOSER_BIN"
          mkdir -p "$DEPLOY_PATH/storage/app" \
                   "$DEPLOY_PATH/storage/framework/cache" \
                   "$DEPLOY_PATH/storage/framework/sessions" \
                   "$DEPLOY_PATH/storage/framework/views" \
                   "$DEPLOY_PATH/storage/logs" \
                   "$DEPLOY_PATH/bootstrap/cache" \
                   "$DEPLOY_PATH/database"

          cd "$DEPLOY_PATH"
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          chown -R "$SITE_USER:$SITE_USER" "$DEPLOY_PATH"
          chmod 640 .env
          chmod -R 775 storage bootstrap/cache database

          if ! grep -q '^APP_KEY=base64:' .env; then
            sudo -u "$SITE_USER" "$PHP_BIN" artisan key:generate --force
          fi

          sudo -u "$SITE_USER" "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          sudo -u "$SITE_USER" "$PHP_BIN" artisan migrate --force
          sudo -u "$SITE_USER" "$PHP_BIN" artisan optimize:clear
          sudo -u "$SITE_USER" "$PHP_BIN" artisan config:cache
          sudo -u "$SITE_USER" "$PHP_BIN" artisan route:cache
          sudo -u "$SITE_USER" "$PHP_BIN" artisan view:cache
          EOF

      - name: Verify deployed application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USERNAME@$SSH_HOST" \
            "curl --fail --silent --show-error --max-time 15 http://127.0.0.1:${{ inputs.port }}/ > /dev/null"
